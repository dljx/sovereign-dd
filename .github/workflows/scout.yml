name: Sovereign Scout (continuous)

on:
  schedule:
    # Every 4 hours. With 48h dedup there is no value running more frequently —
    # the candidate pool doesn't change meaningfully in under 4 hours and
    # back-to-back 15-min runs were exhausting the daily RPD quota by midday.
    # 6 runs/day × 12 debates × ~37 calls = ~2,664 RPD (35% of 7,500 budget).
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: scout
  cancel-in-progress: false  # queue, don't cancel — don't waste in-progress debates

jobs:
  scout:
    name: Run scout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scout history
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            output/scout_history.json
            output/scout_notified.json
          # Restore the most recent history cache from any previous run
          key: scout-history-${{ github.run_id }}
          restore-keys: scout-history-

      - name: Restore scout history from KV (cache-miss fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        env:
          SOVEREIGN_EYE_URL: https://master.sovereign-eye.pages.dev
          DD_UPLOAD_SECRET:  ${{ secrets.DD_UPLOAD_SECRET }}
        run: python download_history.py

      - name: Run scout
        env:
          GEMINI_API_KEYS:          ${{ secrets.GEMINI_API_KEYS }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEYS:   ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_TRADE_ALERTS: ${{ secrets.TELEGRAM_TOPIC_TRADE_ALERTS }}
          TELEGRAM_TOPIC_DEEP_DIVES:   ${{ secrets.TELEGRAM_TOPIC_DEEP_DIVES }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          PORTFOLIO_TICKERS: "AMZN,ANET,EME,MRVL,MTZ,PENG,VST,AVGO,GOOG,MSFT,MU,NOW,P"
          SCOUT_DEBATE_COUNT: "12"
          SCOUT_COOLDOWN_HOURS: "48"
        run: python main.py --scout --save --notify

      - name: Save scout history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            output/scout_history.json
            output/scout_notified.json
          key: scout-history-${{ github.run_id }}

      - name: Upload results to Sovereign Eye
        if: always()
        env:
          DD_UPLOAD_SECRET:  ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL: https://master.sovereign-eye.pages.dev
        run: python upload_kv.py
