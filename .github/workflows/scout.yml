name: Sovereign Scout (continuous)

on:
  schedule:
    # Every 15 min during market hours Mon-Fri.
    # ET (UTC-4 DST / UTC-5 EST) — using 13:00-20:45 UTC to cover 9:00 AM - 4:45 PM ET.
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch: {}

jobs:
  scout:
    name: Run scout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scout history
        uses: actions/cache/restore@v4
        with:
          path: output/scout_history.json
          # Restore the most recent history cache from any previous run
          key: scout-history-${{ github.run_id }}
          restore-keys: scout-history-

      - name: Run scout
        env:
          GEMINI_API_KEYS:          ${{ secrets.GEMINI_API_KEYS }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEYS:   ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_TRADE_ALERTS: ${{ secrets.TELEGRAM_TOPIC_TRADE_ALERTS }}
          TELEGRAM_TOPIC_DEEP_DIVES:   ${{ secrets.TELEGRAM_TOPIC_DEEP_DIVES }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          PORTFOLIO_TICKERS: "AMZN,ANET,EME,MRVL,MTZ,PENG,VST,AVGO,GOOG,MSFT,MU,NOW,P"
          # Continuous-mode: 3 debates per run, 1 convergence loop for speed
          SCOUT_DEBATE_COUNT: "3"
          SCOUT_MAX_LOOPS: "1"
          SCOUT_COOLDOWN_HOURS: "24"
        run: python main.py --scout --save --notify

      - name: Save scout history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: output/scout_history.json
          key: scout-history-${{ github.run_id }}

      - name: Upload results to Sovereign Eye
        if: always()
        env:
          DD_UPLOAD_SECRET:  ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL: https://master.sovereign-eye.pages.dev
        run: python upload_kv.py
