name: Sovereign Gems (daily)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: gems
  cancel-in-progress: false  # queue, don't cancel — don't waste in-progress debates

jobs:
  gems:
    name: Run gems
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore gems history
        uses: actions/cache/restore@v4
        with:
          path: output/gems_history.json
          key: gems-history-${{ github.run_id }}
          restore-keys: gems-history-

      - name: Run gems
        env:
          GEMINI_API_KEYS:          ${{ secrets.GEMINI_API_KEYS }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEYS:   ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_TRADE_ALERTS: ${{ secrets.TELEGRAM_TOPIC_TRADE_ALERTS }}
          TELEGRAM_TOPIC_DEEP_DIVES:   ${{ secrets.TELEGRAM_TOPIC_DEEP_DIVES }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          PORTFOLIO_TICKERS: "AMZN,ANET,EME,MRVL,MTZ,PENG,VST,AVGO,GOOG,MSFT,MU,NOW,P"
          GEMS_DEBATE_COUNT: "6"
          GEMS_COOLDOWN_HOURS: "72"
        run: python main.py --gems --save --notify

      - name: Save gems history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: output/gems_history.json
          key: gems-history-${{ github.run_id }}

      - name: Upload results to Sovereign Eye
        if: always()
        env:
          DD_UPLOAD_SECRET:  ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL: https://master.sovereign-eye.pages.dev
        run: python upload_kv.py
