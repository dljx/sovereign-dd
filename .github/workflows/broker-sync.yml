name: Broker Portfolio Sync

# Daily read-only sync: IBKR Flex (statement token — structurally cannot
# trade) + Tiger OpenAPI (query calls only; see broker_sync.py's read-only
# contract). 09:35 UTC Tue–Sat = after IBKR's overnight statement generation
# for each Mon–Fri session (~17:35 SGT). Until broker secrets are set, each
# missing broker is skipped cleanly (no red runs).
on:
  schedule:
    - cron: "35 9 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + preview only, don't write the dashboard"
        required: false
        default: false
        type: boolean

# The merge endpoint does a KV read-modify-write on positions:daryl — share
# the pipeline group so it can't race scout/analyze uploads.
concurrency:
  group: sovereign-pipeline
  cancel-in-progress: false

jobs:
  sync:
    name: Sync broker positions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync
        env:
          IBKR_FLEX_TOKEN:    ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          TIGER_ID:           ${{ secrets.TIGER_ID }}
          TIGER_ACCOUNT:      ${{ secrets.TIGER_ACCOUNT }}
          TIGER_PRIVATE_KEY:  ${{ secrets.TIGER_PRIVATE_KEY }}
          DD_UPLOAD_SECRET:   ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL:  https://sovereign-eye.pages.dev
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          SYNC_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python broker_sync.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC:     ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC}" \
            -d text="Broker portfolio sync FAILED (run ${GITHUB_RUN_ID}). Dashboard positions were NOT updated. Check GitHub Actions." || true
