name: Sovereign DD

on:
  schedule:
    # 6:00 AM ET (UTC-4 DST / UTC-5 EST). Uses 10:00 UTC â€” correct during DST (Apr-Nov).
    # During EST (Nov-Mar) this fires at 5:00 AM ET â€” still well before market open.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Single ticker to analyze (leave empty for full portfolio + scout)"
        required: false
        default: ""
        type: string

jobs:
  analyze:
    name: Run analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scout history
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            output/scout_history.json
            output/scout_notified.json
          key: scout-history-${{ github.run_id }}
          restore-keys: scout-history-

      - name: Restore scout history from KV (cache-miss fallback)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        env:
          SOVEREIGN_EYE_URL: https://master.sovereign-eye.pages.dev
          DD_UPLOAD_SECRET:  ${{ secrets.DD_UPLOAD_SECRET }}
        run: python download_history.py

      - name: Run analysis
        env:
          GEMINI_API_KEYS:          ${{ secrets.GEMINI_API_KEYS }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEYS:   ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_TRADE_ALERTS: ${{ secrets.TELEGRAM_TOPIC_TRADE_ALERTS }}
          TELEGRAM_TOPIC_DEEP_DIVES:   ${{ secrets.TELEGRAM_TOPIC_DEEP_DIVES }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          PORTFOLIO_TICKERS: "AMZN,ANET,EME,MRVL,MTZ,PENG,VST,AVGO,GOOG,MSFT,MU,NOW,P"
          DD_UPLOAD_SECRET:   ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL:  https://master.sovereign-eye.pages.dev
        run: |
          TICKER="${{ github.event.inputs.ticker }}"
          if [ -z "$TICKER" ]; then
            echo "=== Portfolio scan + Scout (concurrent) ==="
            python main.py --portfolio --scout --save --notify
          else
            echo "=== Single ticker: $TICKER ==="
            python main.py "$TICKER" --save
          fi

      - name: Save scout history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            output/scout_history.json
            output/scout_notified.json
          key: scout-history-${{ github.run_id }}

      - name: Upload results to Sovereign Eye
        env:
          DD_UPLOAD_SECRET:   ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL:  https://master.sovereign-eye.pages.dev
        run: python upload_kv.py
