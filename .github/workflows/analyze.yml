name: Sovereign DD

on:
  schedule:
    # 6:00 AM ET (UTC-4 DST / UTC-5 EST). Uses 10:00 UTC — correct during DST (Apr-Nov).
    # During EST (Nov-Mar) this fires at 5:00 AM ET — still well before market open.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Single ticker to analyze (leave empty for full portfolio)"
        required: false
        default: ""
        type: string

# Scheduled runs share scout.yml's concurrency group: both workflows end by
# POSTing /api/dd/upload, whose KV board merges are read-modify-write. The
# daily analyze sends reconcile_remove for every held ticker (prunes the
# scout/gems/watchlist boards) while a long scout run (30–150 min, starts
# 08:00 UTC) can be mid-upload at 10:00 UTC — a lost-update race that silently
# drops fresh cards. Serializing the scheduled runs closes that window.
# Manual dashboard-triggered runs keep a unique group so a single-ticker
# analysis is never queued behind a 150-minute scout (the residual ms-scale
# overlap risk on those rare runs is accepted).
concurrency:
  group: ${{ github.event_name == 'schedule' && 'sovereign-pipeline' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Run analysis
    runs-on: ubuntu-latest
    # Portfolio scan is ~15 hold-mode debates (well under an hour); 90 min stops
    # a hung LLM call from occupying the runner for GitHub's full 6-hour limit.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          GEMINI_API_KEYS:          ${{ secrets.GEMINI_API_KEYS }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          # Tiger market data (delayed quotes + adjusted bars) — query-only
          # helpers in broker_sync.py, the sole Tiger client constructor.
          TIGER_ID:                 ${{ secrets.TIGER_ID }}
          TIGER_ACCOUNT:            ${{ secrets.TIGER_ACCOUNT }}
          TIGER_PRIVATE_KEY:        ${{ secrets.TIGER_PRIVATE_KEY }}
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEYS:   ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_TRADE_ALERTS: ${{ secrets.TELEGRAM_TOPIC_TRADE_ALERTS }}
          TELEGRAM_TOPIC_DEEP_DIVES:   ${{ secrets.TELEGRAM_TOPIC_DEEP_DIVES }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          TELEGRAM_TOPIC_WATCHLIST:    ${{ secrets.TELEGRAM_TOPIC_WATCHLIST }}
          # FALLBACK ONLY — the live holdings come from positions:daryl via the
          # eye (main.py _portfolio_tickers); this list is used only when that
          # fetch fails. Synced 2026-08-08 to the actual book: it had drifted to
          # exited names (AMZN/NOW/DAVE/HPQ.V) while missing held ones
          # (ADEA/APP/NTNX/PTC/VEEV), so a fetch failure would have analyzed the
          # wrong portfolio. Re-sync when positions change materially.
          PORTFOLIO_TICKERS: "ADEA,ANET,APP,AVGO,CEG,EME,ETN,GOOG,MRVL,MU,NTNX,NU,PENG,PTC,VEEV,VST"
          DD_UPLOAD_SECRET:   ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL:  https://sovereign-eye.pages.dev
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: |
          TICKER="${{ github.event.inputs.ticker }}"
          if [ -z "$TICKER" ]; then
            echo "=== Portfolio scan (unattended — live events off) ==="
            python main.py --portfolio --save --notify
          elif [[ "$TICKER" == *" "* ]]; then
            # Space-separated list → main.py concurrent batch mode. Unattended
            # (nobody watches N parallel debates) so LIVE_EVENTS stays off —
            # N tickers streaming events would blow the KV free-tier budget.
            echo "=== Batch: $TICKER (live events off) ==="
            python main.py $TICKER --save
          else
            # Single-ticker runs are user-triggered from the dashboard and watched
            # live, so stream debate events to KV. Scheduled runs leave LIVE_EVENTS
            # unset to stay under the Cloudflare KV free-tier write budget.
            echo "=== Single ticker: $TICKER (live events on) ==="
            LIVE_EVENTS=1 python main.py "$TICKER" --save
          fi

      - name: Refresh signal scoreboard
        # Derived, recomputable data — a yfinance/Supabase blip must not kill
        # the run; continue-on-error keeps the failure visible in the Actions
        # UI. The JSON lands in output/scoreboard.json, which the upload step
        # ships to KV dd:scoreboard for the dashboard panel. The Telegram
        # digest inside is Monday-gated by the script itself.
        continue-on-error: true
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          # behavior-gap section reads the real broker NAV series from the eye
          DD_UPLOAD_SECRET:   ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL:  https://sovereign-eye.pages.dev
        run: python signal_analysis.py --json output/scoreboard.json --digest-weekly

      - name: Upload results to Sovereign Eye
        env:
          DD_UPLOAD_SECRET:   ${{ secrets.DD_UPLOAD_SECRET }}
          SOVEREIGN_EYE_URL:  https://sovereign-eye.pages.dev
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: python upload_kv.py

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC:     ${{ secrets.TELEGRAM_TOPIC_DEEP_DIVES }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d message_thread_id="${TELEGRAM_TOPIC}" \
            -d text="Sovereign DD analyze run FAILED (run ${GITHUB_RUN_ID}). Check GitHub Actions." || true
