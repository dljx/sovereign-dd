name: Sovereign DD

on:
  schedule:
    # 6:00 AM ET (UTC-4 DST / UTC-5 EST). Uses 10:00 UTC — correct during DST (Apr-Nov).
    # During EST (Nov-Mar) this fires at 5:00 AM ET — still well before market open.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Single ticker to analyze (leave empty for full portfolio + scout)"
        required: false
        default: ""
        type: string

jobs:
  analyze:
    name: Run analysis
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          GEMINI_API_KEYS:          ${{ secrets.GEMINI_API_KEYS }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEYS:   ${{ secrets.ALPHA_VANTAGE_API_KEYS }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_TRADE_ALERTS: ${{ secrets.TELEGRAM_TOPIC_TRADE_ALERTS }}
          TELEGRAM_TOPIC_DEEP_DIVES:   ${{ secrets.TELEGRAM_TOPIC_DEEP_DIVES }}
          TELEGRAM_TOPIC_SCAN_RESULTS: ${{ secrets.TELEGRAM_TOPIC_SCAN_RESULTS }}
          PORTFOLIO_TICKERS: "AMZN,ANET,EME,MPWR,MRVL,PENG,SKWD,AVGO,GOOG,MSFT,MU,NOW,RDDT"
        run: |
          TICKER="${{ github.event.inputs.ticker }}"
          if [ -z "$TICKER" ]; then
            echo "=== Portfolio scan ==="
            python main.py --portfolio --save --notify
            echo "=== Scout mode ==="
            python main.py --scout --save --notify
          else
            echo "=== Single ticker: $TICKER ==="
            python main.py "$TICKER" --save
          fi

      - name: Upload results to Cloudflare KV
        env:
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: python upload_kv.py
